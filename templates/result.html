<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Bus Result</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header class="topbar">

<div class="logo">

🚌 Private Bus Finder

</div>

</header>

<div class="card">

<h2>

{{ boarding }}

➡

{{ destination }}

</h2>

<br>

{% if buses %}

    {% for bus in buses %}

    <div class="bus-card">

        <h3>{{ bus.time }}</h3>

        <p>{{ bus.bus }}</p>

        <p>{{ bus.route }}</p>

    </div>

    <br>

    {% endfor %}

{% else %}

<div class="no-bus">

    <h2>🚌 No Bus Found</h2>

    <p>No buses are available for this route.</p>

</div>

{% endif %}

</div>

</body>
</html>
