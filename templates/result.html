<!DOCTYPE html>
<html>
<head>
    <title>Search Result</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="topbar">

    <div class="logo">
        🚌 <span>Private Bus Finder</span>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/timetable">Timetable</a>
        <a href="/about">About</a>
    </nav>

</header>

<div class="card">

    <h2>Search Result</h2>

    <h3>
        Route :
        {{ boarding.title() }}
        →
        {{ destination.title() }}
    </h3>

    {% if buses %}

        {% for bus in buses %}

        <div class="bus-card">

            <h3>🚌 {{ bus.bus }}</h3>

            <p>🕗 {{ bus.time }}</p>

        </div>

        {% endfor %}

    {% else %}

        <div class="no-bus">

            <h3>❌ No Bus Found</h3>

            <p>Try another route.</p>

        </div>

    {% endif %}

    <br>

    <a href="/">← Back</a>

</div>

</body>
</html>
